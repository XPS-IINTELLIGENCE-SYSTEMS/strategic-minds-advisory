name: Manual AI in Action Verification

on:
  workflow_dispatch:

jobs:
  verify:
    # Quarantined legacy runtime; see docs/LEGACY_RUNTIME_RETIREMENT_20261003.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify health endpoint
        run: |
          curl -fsS https://strategicmindsadvisory.com/api/health

      - name: Verify task dispatch endpoint
        run: |
          curl -fsS https://strategicmindsadvisory.com/api/task-dispatch

      - name: Verify agent loop endpoint
        run: |
          curl -fsS https://strategicmindsadvisory.com/api/agent-loop
